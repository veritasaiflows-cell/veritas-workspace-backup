// Generalized Entry Band Viewer — ticker-agnostic.

//   "macro_regimes": {

//      ...

// window.__ENTRY_BAND_DATA__. This lets the same JSX serve both a
// build-step React app AND a self-contained HTML report (where the

// ── Helpers ────────────────────────────────────────────────────────

function isInPeriod(date, periodStr) {
  const [start, end] = periodStr.split(":");
  return date >= start && date <= end;
}

function makeRegimeLookup(regimes) {
  return (date) => {
    for (const [key, regime] of Object.entries(regimes)) {
      for (const period of regime.periods) {
        if (isInPeriod(date, period)) return key;
      }
    }
    return "unknown";
  };
}

// ── Indicator math ────────────────────────────────────────────────

function computeSMA(data, window) {
  return data.map((_, i) => {
    if (i < window - 1) return null;
    let sum = 0;
    for (let j = i - window + 1; j <= i; j++) sum += data[j].c;
    return sum / window;
  });
}

function computeEMA(data, window) {
  if (!data.length) return [];
  const k = 2 / (window + 1);
  const ema = [data[0].c];
  for (let i = 1; i < data.length; i++) {
    ema.push(data[i].c * k + ema[i - 1] * (1 - k));
  }
  return ema;
}

function computeATR(data, window) {
  if (!data.length) return [];
  const tr = data.map((d, i) => {
    if (i === 0) return d.h - d.l;
    const prev = data[i - 1].c;
    return Math.max(d.h - d.l, Math.abs(d.h - prev), Math.abs(d.l - prev));
  });
  const atr = [tr[0]];
  const k = 2 / (window + 1);
  for (let i = 1; i < tr.length; i++) {
    atr.push(tr[i] * k + atr[i - 1] * (1 - k));
  }
  return atr;
}

function computeRSI(data, window = 14) {
  const rsi = new Array(data.length).fill(null);
  if (data.length < window + 1) return rsi;
  let gains = 0, losses = 0;
  for (let i = 1; i <= window; i++) {
    const diff = data[i].c - data[i - 1].c;
    if (diff > 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / window;
  let avgLoss = losses / window;
  rsi[window] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = window + 1; i < data.length; i++) {
    const diff = data[i].c - data[i - 1].c;
    avgGain = (avgGain * (window - 1) + (diff > 0 ? diff : 0)) / window;
    avgLoss = (avgLoss * (window - 1) + (diff < 0 ? -diff : 0)) / window;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

  const { smaLen = 10, atrLen = 10, atrMult = 2, envPct = 5, shortMA = 5, longMA = 10 } = params;

      const upper = Math.max(short[i], long[i]);
      const lower = Math.min(short[i], long[i]);
      return { mid: (short[i] + long[i]) / 2, upper, lower };
    });
  }
  if (method === "bollinger") {
    const sma = computeSMA(data, smaLen);
    const mult = params.bbMult ?? 2;
    return data.map((_, i) => {
      if (sma[i] === null) return { mid: null, upper: null, lower: null };
      const slice = data.slice(Math.max(0, i - smaLen + 1), i + 1).map(d => d.c);
      const variance = slice.reduce((sum, v) => sum + (v - sma[i]) ** 2, 0) / slice.length;
      const sd = Math.sqrt(variance);
      return { mid: sma[i], upper: sma[i] + mult * sd, lower: sma[i] - mult * sd };
    });
  }
  return data.map(() => ({ mid: null, upper: null, lower: null }));
}

// ── Backtest ──────────────────────────────────────────────────────

function backtestEntries(data, bands, regimeFilter, getRegime, fwdPeriods) {
  const entries = [];
  for (let i = 1; i < data.length; i++) {
    if (bands[i].lower === null) continue;
    const regime = getRegime(data[i].d);
    if (regimeFilter !== "all" && regime !== regimeFilter) continue;
    if (data[i].c <= bands[i].lower) {
      const fwdReturns = {};
      const fwdDrawdowns = {};
      for (const p of fwdPeriods) {
        if (i + p < data.length) {
          fwdReturns[`fwd_${p}`] = ((data[i + p].c - data[i].c) / data[i].c) * 100;
          let minLow = Infinity;
          for (let j = i + 1; j <= Math.min(i + p, data.length - 1); j++) {
            minLow = Math.min(minLow, data[j].l);
          }
          fwdDrawdowns[`dd_${p}`] = ((minLow - data[i].c) / data[i].c) * 100;
        }
      }
      entries.push({ idx: i, date: data[i].d, price: data[i].c, regime, bandLower: bands[i].lower, ...fwdReturns, ...fwdDrawdowns });
    }
  }
  return entries;
}

function computeStats(entries, fwdPeriods) {
  if (entries.length === 0) return null;
  const stats = {};
  for (const p of fwdPeriods) {
    const key = `fwd_${p}`;
    const ddKey = `dd_${p}`;
    const vals = entries.filter(e => e[key] !== undefined).map(e => e[key]);
    const dds = entries.filter(e => e[ddKey] !== undefined).map(e => e[ddKey]);
    if (vals.length === 0) continue;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const winRate = vals.filter(v => v > 0).length / vals.length;
    const median = [...vals].sort((a, b) => a - b)[Math.floor(vals.length / 2)];
    const avgDD = dds.length > 0 ? dds.reduce((a, b) => a + b, 0) / dds.length : 0;
    const maxDD = dds.length > 0 ? Math.min(...dds) : 0;
    stats[p] = { avg, median, winRate, avgDD, maxDD, n: vals.length };
  }
  return stats;
}

            )}

            {/* RSI sub-panel */}
            <div style={{ background: "var(--card)", borderRadius: 12, border: "1px solid var(--border)", padding: "12px 16px", marginTop: 12 }}>
              <div style={{ fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>RSI (14)</div>
              <ResponsiveContainer width="100%" height={110}>
                <ComposedChart data={chartData} margin={{ top: 4, right: 10, bottom: 0, left: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1e2530" vertical={false} />
                  <XAxis dataKey="date" hide />
                  <YAxis domain={[0, 100]} tick={{ fill: "#6b7280", fontSize: 10 }} stroke="#1e2530" ticks={[30, 50, 70]} width={28} />
                  <Tooltip
                    contentStyle={{ background: "#141820", border: "1px solid #1e2530", borderRadius: 8, fontSize: 12 }}
                    formatter={(v) => [v != null ? v.toFixed(1) : "—", "RSI"]}
                    labelFormatter={v => v}
                  />
                  <ReferenceLine y={70} stroke="#ef444450" strokeDasharray="3 3" strokeWidth={1} />
                  <ReferenceLine y={30} stroke="#10b98150" strokeDasharray="3 3" strokeWidth={1} />
                  <ReferenceLine y={50} stroke="#6b728030" strokeDasharray="2 2" strokeWidth={1} />
                  <Line dataKey="rsi" stroke="#f59e0b" strokeWidth={1.5} dot={false} isAnimationActive={false} connectNulls={false} />
                </ComposedChart>
              </ResponsiveContainer>
              <div style={{ display: "flex", gap: 16, justifyContent: "flex-end", marginTop: 4 }}>
                <span style={{ fontSize: 10, color: "#ef4444" }}>— 70 overbought</span>
                <span style={{ fontSize: 10, color: "#10b981" }}>— 30 oversold</span>
              </div>
            </div>

            {/* Volume sub-panel */}
            <div style={{ background: "var(--card)", borderRadius: 12, border: "1px solid var(--border)", padding: "12px 16px", marginTop: 12 }}>
              <div style={{ fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Volume (M shares)</div>
              <ResponsiveContainer width="100%" height={90}>
                <BarChart data={chartData} margin={{ top: 4, right: 10, bottom: 0, left: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1e2530" vertical={false} />
                  <XAxis dataKey="date" hide />
                  <YAxis tick={{ fill: "#6b7280", fontSize: 10 }} stroke="#1e2530" width={28} tickFormatter={v => v >= 1000 ? `${(v / 1000).toFixed(0)}B` : `${v}M`} />
                  <Tooltip
                    contentStyle={{ background: "#141820", border: "1px solid #1e2530", borderRadius: 8, fontSize: 12 }}
                    formatter={(v) => [v != null ? `${v.toFixed(1)}M` : "—", "Volume"]}
                    labelFormatter={v => v}
                  />
                  <Bar dataKey="volume" fill="#3b82f6" fillOpacity={0.4} radius={[2, 2, 0, 0]}>
                    {chartData.map((d, i) => (
                      <Cell key={i} fill={d.close >= (chartData[i - 1]?.close ?? d.close) ? "#10b981" : "#ef4444"} fillOpacity={0.35} />
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        )}

        {/* STATS TAB */}
        {tab === "stats" && (
          <div>
            {entries.length === 0 ? (
              <div style={{ textAlign: "center", padding: 40, color: "var(--muted)" }}>
                No entry signals found for this regime/method combination. Try adjusting parameters or broadening the regime filter.
              </div>
            ) : (
              <>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 16 }}>
                  <StatCard label="Total Signals" value={entries.length} sub={regime === "all" ? "All regimes" : MACRO_REGIMES[regime]?.label} />
                  <StatCard label="Current Price" value={`$${fmt(latest.close, 2)}`} sub={`Lower band: $${fmt(latest.lower, 2)}`} />
                  <StatCard
                    label="Distance to Entry"
                    value={latest.lower ? fmtPct(((latest.lower - latest.close) / latest.close) * 100) : "—"}
                    accent={latest.close <= (latest.lower || 0) ? "var(--green)" : "var(--amber)"}
                    sub={latest.close <= (latest.lower || 0) ? "IN ENTRY ZONE" : "Above band"}
                  />
                </div>

                <div style={{ background: "var(--card)", borderRadius: 12, border: "1px solid var(--border)", padding: 20, marginBottom: 16 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 16 }}>Forward Returns After Entry Signal</div>
                  <div style={{ overflowX: "auto" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                      <thead>
                        <tr style={{ borderBottom: "1px solid var(--border)" }}>
                          <th style={{ textAlign: "left", padding: "8px 12px", color: "var(--muted)", fontSize: 11, textTransform: "uppercase" }}>Horizon</th>
                          <th style={{ textAlign: "right", padding: "8px 12px", color: "var(--muted)", fontSize: 11 }}>Signals</th>
                          <th style={{ textAlign: "right", padding: "8px 12px", color: "var(--muted)", fontSize: 11 }}>Win Rate</th>
                          <th style={{ textAlign: "right", padding: "8px 12px", color: "var(--muted)", fontSize: 11 }}>Avg Return</th>
                          <th style={{ textAlign: "right", padding: "8px 12px", color: "var(--muted)", fontSize: 11 }}>Median</th>
                          <th style={{ textAlign: "right", padding: "8px 12px", color: "var(--muted)", fontSize: 11 }}>Avg Drawdown</th>
                          <th style={{ textAlign: "right", padding: "8px 12px", color: "var(--muted)", fontSize: 11 }}>Max Drawdown</th>
                        </tr>
                      </thead>
                      <tbody>
                        {stats && FWD.map(p => stats[p] && (
                          <tr key={p} style={{ borderBottom: "1px solid var(--border)" }}>
                            <td style={{ padding: "10px 12px", fontWeight: 600 }}>{p} {FWD_LABEL}</td>
                            <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: "'JetBrains Mono'" }}>{stats[p].n}</td>
                            <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: stats[p].winRate >= 0.6 ? "var(--green)" : stats[p].winRate >= 0.45 ? "var(--amber)" : "var(--red)" }}>
                              {(stats[p].winRate * 100).toFixed(0)}%
                            </td>
                            <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: stats[p].avg >= 0 ? "var(--green)" : "var(--red)" }}>
                              {fmtPct(stats[p].avg)}
                            </td>
                            <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: stats[p].median >= 0 ? "var(--green)" : "var(--red)" }}>
                              {fmtPct(stats[p].median)}
                            </td>
                            <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: "var(--red)" }}>
                              {fmtPct(stats[p].avgDD)}
                            </td>
                            <td style={{ padding: "10px 12px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: "var(--red)" }}>
                              {fmtPct(stats[p].maxDD)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Distribution chart for the middle horizon */}
                {(() => {
                  const midHorizon = FWD[Math.floor(FWD.length / 2)];
                  if (!stats || !stats[midHorizon]) return null;
                  const distData = entries.filter(e => e[`fwd_${midHorizon}`] !== undefined).map(e => ({ date: e.date, ret: e[`fwd_${midHorizon}`] }));
                  return (
                    <div style={{ background: "var(--card)", borderRadius: 12, border: "1px solid var(--border)", padding: 20 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>{midHorizon}-{FWD_LABEL.toLowerCase()} Forward Return Distribution</div>
                      <ResponsiveContainer width="100%" height={200}>
                        <BarChart data={distData}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#1e2530" vertical={false} />
                          <XAxis dataKey="date" tick={{ fill: "#6b7280", fontSize: 9 }} tickFormatter={v => v.slice(2)} stroke="#1e2530" />
                          <YAxis tick={{ fill: "#6b7280", fontSize: 10 }} tickFormatter={v => `${v}%`} stroke="#1e2530" />
                          <Tooltip contentStyle={{ background: "#141820", border: "1px solid #1e2530", borderRadius: 8, fontSize: 12 }} formatter={v => [fmtPct(v), "Return"]} />
                          <ReferenceLine y={0} stroke="#6b728050" />
                          <Bar dataKey="ret" radius={[3, 3, 0, 0]}>
                            {distData.map((e, i) => (
                              <Cell key={i} fill={e.ret >= 0 ? "#10b981" : "#ef4444"} fillOpacity={0.7} />
                            ))}
                          </Bar>
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  );
                })()}
              </>
            )}
          </div>
        )}

        {/* ENTRIES TAB */}
        {tab === "entries" && (
          <div style={{ background: "var(--card)", borderRadius: 12, border: "1px solid var(--border)", padding: 20 }}>
            {entries.length === 0 ? (
              <div style={{ textAlign: "center", padding: 40, color: "var(--muted)" }}>
                No entry signals found. Try adjusting the band parameters or macro regime filter.
              </div>
            ) : (
              <>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 16 }}>{entries.length} Entry Signals Detected</div>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead>
                      <tr style={{ borderBottom: "1px solid var(--border)" }}>
                        <th style={{ textAlign: "left", padding: "8px 10px", color: "var(--muted)", fontSize: 11 }}>Date</th>
                        <th style={{ textAlign: "right", padding: "8px 10px", color: "var(--muted)", fontSize: 11 }}>Entry Price</th>
                        <th style={{ textAlign: "right", padding: "8px 10px", color: "var(--muted)", fontSize: 11 }}>Lower Band</th>
                        <th style={{ textAlign: "center", padding: "8px 10px", color: "var(--muted)", fontSize: 11 }}>Regime</th>
                        {FWD.map(p => (
                          <th key={p} style={{ textAlign: "right", padding: "8px 10px", color: "var(--muted)", fontSize: 11 }}>{p}{FWD_LABEL[0].toLowerCase()} Fwd</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {entries.map((e, i) => (
                        <tr key={i} style={{ borderBottom: "1px solid var(--border)" }}>
                          <td style={{ padding: "8px 10px", fontFamily: "'JetBrains Mono'" }}>{e.date}</td>
                          <td style={{ padding: "8px 10px", textAlign: "right", fontFamily: "'JetBrains Mono'" }}>${fmt(e.price, 2)}</td>
                          <td style={{ padding: "8px 10px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: "var(--muted)" }}>${fmt(e.bandLower, 2)}</td>
                          <td style={{ padding: "8px 10px", textAlign: "center" }}>
                            <span style={{
                              fontSize: 10, padding: "2px 8px", borderRadius: 10,
                              background: (MACRO_REGIMES[e.regime]?.color || "#666") + "20",
                              color: MACRO_REGIMES[e.regime]?.color || "#666",
                            }}>
                              {MACRO_REGIMES[e.regime]?.label || e.regime}
                            </span>
                          </td>
                          {FWD.map(p => (
                            <td key={p} style={{ padding: "8px 10px", textAlign: "right", fontFamily: "'JetBrains Mono'", color: ((e[`fwd_${p}`] ?? 0) >= 0) ? "var(--green)" : "var(--red)" }}>
                              {e[`fwd_${p}`] !== undefined ? fmtPct(e[`fwd_${p}`]) : "—"}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </div>
        )}

        <div style={{ marginTop: 16, padding: 16, background: "var(--card)", borderRadius: 12, border: "1px solid var(--border)", fontSize: 11, color: "var(--muted)", lineHeight: 1.6 }}>
          <strong style={{ color: "var(--text)" }}>Methodology</strong> — Entry signals trigger when the bar close penetrates the lower band of the chosen method.
          Forward returns are measured at the configured horizons from the entry bar. Drawdown measures the worst intra-period low relative to entry.
          The macro regime filter isolates periods with comparable monetary policy, volatility, and growth dynamics.
          Price data is from yfinance via <code>scripts/entry_band_fetch.py</code>; macro regime tags are workspace-defined and editable in that script.
          {preferred && <> Vault preferred band/stop overlay reflects the current entries in the Technical Entry and Invalidation Sheet (set {preferred.set || "—"}).</>}
          {" "}<strong style={{ color: "var(--amber)" }}>Decision support, not financial advice.</strong>
        </div>
      </div>
    </div>
  );
}


import React from "react";
import { createRoot } from "react-dom/client";
const __root = createRoot(document.getElementById("root"));
__root.render(React.createElement(EntryBandViewer));
  </script>
</body>
</html>
