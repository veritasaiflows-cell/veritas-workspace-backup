receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  file/traces:
    path: tmp/otel-collector/traces.jsonl
  file/metrics:
    path: tmp/otel-collector/metrics.jsonl
  file/logs:
    path: tmp/otel-collector/logs.jsonl

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
